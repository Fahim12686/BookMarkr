spring.application.name=bookmarkr

# MongoDB Atlas connection string, provided via environment variable.
# Example: mongodb+srv://user:password@cluster.mongodb.net/bookmarkr
# Disable Thymeleaf caching for easier local development
spring.data.mongodb.uri=${MONGODB_URI}


spring.thymeleaf.cache=false

# Use the platform-provided port when deployed, default to 8080 locally
server.port=${PORT:9090}
